# n8n lokal starten: docker compose up -d  →  http://localhost:5678
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.44.7}
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
      # Nur für den lokalen Betrieb ohne HTTPS. Im Internet immer HTTPS nutzen.
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
