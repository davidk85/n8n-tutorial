# n8n lokal starten: docker compose up -d  →  http://localhost:5678
# Qdrant (ab Folge 6) läuft daneben: Dashboard unter http://localhost:6333/dashboard,
# in n8n erreichbar unter http://qdrant:6333.
services:
  n8n:
    # Folgen 0 bis 23 sind mit n8n 2.44.7 aufgenommen. Wer genau diesen Stand will, nimmt die
    # auskommentierte Zeile. Zurück auf eine ältere Version geht nur mit einem Backup von vorher
    # (Folge 23), eine schon aktualisierte Datenbank läuft nicht mit einer älteren Version.
    # image: docker.n8n.io/n8nio/n8n:2.44.7
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.45.5}
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
      # Nur für den lokalen Betrieb ohne HTTPS. Im Internet immer HTTPS nutzen.
      - N8N_SECURE_COOKIE=false
    # Ab Folge 12: Ollama auf deinem Rechner ist in n8n unter http://host.docker.internal:11434
    # erreichbar (Docker Desktop kann das von selbst, unter Linux braucht es diese Zeile).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n

  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.17.0}
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Test-Postfach (ab Folge 11): fängt jede E-Mail ab, statt sie zu verschicken.
  # In n8n als SMTP-Server mailpit, Port 1025, SSL aus. Postfach: http://localhost:8025
  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION:-v1.27}
    restart: unless-stopped
    ports:
      - "8025:8025"

volumes:
  n8n_data:
  qdrant_data:
